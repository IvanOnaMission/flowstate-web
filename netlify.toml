# Connected to IvanOnaMission/flowstate-web on 2026-08-17. Before that this
# site was manual-deploy only, which is how both /private/p/* offer pages
# ended up 404ing while sitting fine in the repo. Pushes to main now deploy.
# Netlify was publishing the repo root back when the site was hand-written
# HTML. It's a Next.js static export now, so the build output is out/.
# Settings here override whatever is set in the Netlify UI.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Baseline browser protections for every page. Netlify already serves HSTS on HTTPS.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/ads/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    # The dashboard holds a signed-in session: allow only its own scripts and the Supabase login.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"

# Static export writes /about/index.html etc, so Netlify's default
# pretty-URL handling is enough — no redirects needed for the app routes.
# The hand-written pages under public/ (offer pages, audit tool) are copied
# through untouched and keep their exact URLs.

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The private offer pages are unlisted, not secret — keep them out of search.
[[headers]]
  for = "/private/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Retired audit tools remain reachable through existing links, but unindexed.
[[headers]]
  for = "/audit/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Ad landing for the Business Essentials VSL. The page also sends noindex.
# It must stay out of search; the old /business-essentials/ URL redirects to /services/ (public/_redirects).
[[headers]]
  for = "/essentials"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/essentials/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/audit-full/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
